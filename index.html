<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PlanerBot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #1e1e2e;
            color: #e2e8f0;
            font-family: 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
            padding: 15px;
        }
        
        /* Верхний блок - профиль */
        .profile-block {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid #334155;
        }
        
        .user-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #34d399;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        
        .user-info h2 {
            font-size: 1.3em;
            font-weight: 600;
        }
        
        .user-info p {
            color: #94a3b8;
            font-size: 0.9em;
        }
        
        /* Средние карточки создания */
        .creation-cards {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 25px;
        }
        
        .card {
            background: #334155;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .card:hover {
            background: #3d5067;
        }
        
        .card-icon {
            font-size: 28px;
            margin-bottom: 8px;
        }
        
        .card-text {
            font-size: 1.1em;
            font-weight: 500;
        }
        
        /* Нижние карточки */
        .list-cards {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 25px;
        }
        
        /* Футер */
        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 15px;
            border-top: 1px solid #334155;
        }
        
        .footer-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.1em;
        }
        
        .footer-item.active {
            color: #34d399;
        }
    </style>
</head>
<body>
    <!-- Верхний блок: профиль -->
    <div class="profile-block">
        <div class="user-avatar">👤</div>
        <div class="user-info">
            <h2 id="userName">Загрузка...</h2>
            <p>Премиум подписка ✓</p>
        </div>
    </div>

    <!-- Средние карточки создания -->
    <div class="creation-cards">
        <div class="card" onclick="createTask()">
            <div class="card-icon">✅</div>
            <div class="card-text">Создать задачу</div>
        </div>
        <div class="card" onclick="createMeeting()">
            <div class="card-icon">📅</div>
            <div class="card-text">Создать встречу</div>
        </div>
    </div>

    <!-- Нижние карточки списков -->
    <div class="list-cards">
        <div class="card" onclick="viewTasks()">
            <div class="card-icon">📋</div>
            <div class="card-text">Созданные задачи</div>
        </div>
        <div class="card" onclick="viewMeetings()">
            <div class="card-icon">📆</div>
            <div class="card-text">Созданные встречи</div>
        </div>
    </div>

    <!-- Футер -->
    <div class="footer">
        <div class="footer-item active">
            <span>📅</span>
            <span>Расписание</span>
        </div>
        <div class="footer-item">
            <span>⚙️</span>
            <span>Настройки</span>
        </div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        // Инициализация Telegram
        let tg;
        window.onload = function() {
            if (window.Telegram && window.Telegram.WebApp) {
                tg = window.Telegram.WebApp;
                
                // Получаем имя пользователя
                if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                    const user = tg.initDataUnsafe.user;
                    document.getElementById('userName').textContent = user.first_name || 'Гость';
                }
                
                tg.setHeaderColor('#1e1e2e');
                tg.setBackgroundColor('#1e1e2e');
            }
        };
        
        // Заглушки для функций
        function createTask() {
            alert('Создание задачи - в разработке');
        }
        
        function createMeeting() {
            alert('Создание встречи - в разработке');
        }
        
        function viewTasks() {
            alert('Просмотр задач - в разработке');
        }
        
        function viewMeetings() {
            alert('Просмотр встреч - в разработке');
        }
    </script>
</body>
</html>
