<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PlanerBot - Календарь задач</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 15px;
            background: #1e1e2e;
            color: #e2e8f0;
            font-family: 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header h1 {
            font-size: 1.5em;
            margin: 0;
        }
        .nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .nav-btn {
            background: #334155;
            border: none;
            color: #e2e8f0;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1.1em;
        }
        .month-year {
            font-weight: bold;
            font-size: 1.2em;
        }
        .calendar {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
            margin-bottom: 20px;
        }
        .day-header {
            text-align: center;
            color: #94a3b8;
            font-size: 0.9em;
            padding: 8px 0;
        }
        .day-header-cell {
            text-align: center;
            color: #94a3b8;
            font-size: 0.9em;
            padding: 8px 0;
        }
        .day-cell {
            background: #334155;
            border-radius: 6px;
            min-height: 60px;
            padding: 5px;
            cursor: pointer;
            position: relative;
        }
        .day-cell:hover {
            background: #3d5067;
        }
        .day-number {
            font-size: 0.8em;
            color: #94a3b8;
        }
        .today {
            border: 2px solid #34d399;
        }
        .other-month {
            opacity: 0.3;
        }
        .task-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin: 2px auto;
        }
        .task-low { background: #fbbf24; }
        .task-medium { background: #f97316; }
        .task-high { background: #ef4444; }
        .tasks-container {
            margin-top: 15px;
        }
        .task-item {
            background: #334155;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            position: relative;
        }
        .task-title {
            font-weight: bold;
            margin-bottom: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .task-desc {
            font-size: 0.9em;
            color: #94a3b8;
        }
        .task-priority {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.7em;
            margin-left: 8px;
        }
        .priority-low { background: #16a34a; }
        .priority-medium { background: #f59e0b; }
        .priority-high { background: #dc2626; }
        .delete-btn {
            background: none;
            border: none;
            color: #ef4444;
            cursor: pointer;
            font-size: 1.2em;
            padding: 0 5px;
        }
        .add-btn {
            background: #34d399;
            color: #1e1e2e;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            display: block;
            width: 100%;
            margin-top: 10px;
        }
        .add-btn:hover {
            background: #2bb789;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 100;
        }
        .modal-content {
            background: #2d2d3a;
            margin: 20% auto;
            padding: 20px;
            border-radius: 10px;
            width: 90%;
            max-width: 400px;
        }
        .modal h3 {
            margin-top: 0;
        }
        .modal input, .modal textarea, .modal select {
            width: 100%;
            padding: 10px;
            margin: 5px 0 15px;
            border: 1px solid #444;
            border-radius: 6px;
            background: #334155;
            color: #e2e8f0;
        }
        .modal-btn {
            background: #34d399;
            color: #1e1e2e;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            margin-right: 10px;
        }
        .modal-btn.cancel {
            background: #ef4444;
            color: white;
        }
        .empty-state {
            text-align: center;
            color: #94a3b8;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <h1 style="margin: 0; font-size: 1.3em;">PlanerBot</h1>
            <img src="https://upload.wikimedia.org/wikipedia/commons/5/50/User_Telegram_logo.svg" 
                 alt="Telegram" 
                 style="width: 40px; height: 40px;" 
                 id="telegramLogo"
                 onload="initUserInfo()">
        </div>
        <div id="greeting" style="text-align: center; color: #94a3b8; font-size: 1.1em;"></div>
    </div>

    <div class="nav">
        <button class="nav-btn" onclick="prevMonth()">‹</button>
        <div class="month-year" id="monthYear"></div>
        <button class="nav-btn" onclick="nextMonth()">›</button>
    </div>

    <div class="calendar" id="calendar"></div>

    <div class="tasks-container">
        <h3 style="display: flex; justify-content: space-between; align-items: center;">
            <span id="taskHeader">Задачи на сегодня</span>
            <span id="deleteAllContainer"></span>
        </div>
        <div id="taskList">
            <!-- Задачи будут добавлены здесь -->
        </div>
        <button class="add-btn" onclick="showAddModal()">➕ Добавить задачу</button>
    </div>

    <!-- Модальное окно добавления/редактирования задачи -->
    <div class="modal" id="taskModal">
        <div class="modal-content">
            <h3 id="taskModalTitle">Новая задача</h3>
            <input type="text" id="taskTitle" placeholder="Заголовок задачи" required>
            <textarea id="taskDesc" placeholder="Описание задачи"></textarea>
            <select id="taskPriority">
                <option value="low">🟢 Низкий приоритет</option>
                <option value="medium">🟡 Средний приоритет</option>
                <option value="high">🔴 Высокий приоритет</option>
            </select>
            <div>
                <button class="modal-btn" onclick="saveTask()">Сохранить</button>
                <button class="modal-btn cancel" onclick="closeModal()">Отмена</button>
            </div>
        </div>
    </div>

    <!-- Telegram Web App API -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        let currentDate = new Date();
        let selectedDate = new Date();
        let tasks = JSON.parse(localStorage.getItem('tasks')) || {};
        let currentTask = null;
        
        const DAY_HEADERS = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
        const MONTH_NAMES = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь',
                             'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];

        function initTelegram() {
            if (window.Telegram && window.Telegram.WebApp) {
                const tg = window.Telegram.WebApp;
                tg.setHeaderColor('#1e1e2e');
                tg.setBackgroundColor('#1e1e2e');
                tg.MainButton.setParams({
                    text: "Готово",
                    color: "#34d399"
                });
                
                tg.MainButton.onClick(() => {
                    const dateStr = formatDate(selectedDate);
                    tg.sendData(JSON.stringify({
                        tasks: tasks[dateStr] || [],
                        selectedDate: dateStr
                    }));
                });
                
                const user = tg.initDataUnsafe?.user;
                console.log('Telegram user:', user);
                
                // Отображаем приветствие с именем пользователя
                const greetingEl = document.getElementById('greeting');
                if (user) {
                    const firstName = user.first_name || '';
                    greetingEl.innerHTML = '👋 Привет' + (firstName ? ', <strong>' + firstName + '</strong>' : '') + '!';
                }
            }
        }

        function initUserInfo() {
            // Инициализируем Telegram Web App после загрузки логотипа
            initTelegram();
        }

        function formatDate(date) {
            return date.getFullYear() + '-' +
                   String(date.getMonth() + 1).padStart(2, '0') + '-' +
                   String(date.getDate()).padStart(2, '0');
        }

        function renderCalendar(date) {
            const year = date.getFullYear();
            const month = date.getMonth();
            
            document.getElementById('monthYear').textContent = 
                MONTH_NAMES[month] + ' ' + year;
            
            const firstDay = new Date(year, month, 1).getDay();
            const lastDate = new Date(year, month + 1, 0).getDate();
            
            const adjustedFirstDay = firstDay === 0 ? 6 : firstDay - 1;
            const today = new Date();
            const todayStr = formatDate(today);
            
            let calendarHTML = '';
            DAY_HEADERS.forEach(function(day) {
                calendarHTML += '<div class="day-header-cell">' + day + '</div>';
            });
            
            const prevMonthLastDate = new Date(year, month, 0).getDate();
            for (let i = adjustedFirstDay - 1; i >= 0; i--) {
                calendarHTML += '<div class="day-cell other-month">' + (prevMonthLastDate - i) + '</div>';
            }
            
            for (let d = 1; d <= lastDate; d++) {
                const dateStr = year + '-' + String(month + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
                const dayTasks = tasks[dateStr] || [];
                
                let taskIndicators = '';
                if (dayTasks.length > 0) {
                    const priority = dayTasks[0].priority || 'low';
                    taskIndicators = '<div class="task-indicator task-' + priority + '"></div>';
                }
                
                let classes = 'day-cell';
                if (dateStr === todayStr) classes += ' today';
                
                calendarHTML += '<div class="' + classes + '" onclick="selectDate(' + year + ', ' + (month + 1) + ', ' + d + ')">' +
                    '<div class="day-number">' + d + '</div>' +
                    taskIndicators +
                    '</div>';
            }
            
            const totalCells = adjustedFirstDay + lastDate;
            const remainingCells = 7 - (totalCells % 7);
            if (remainingCells < 7) {
                for (let i = 1; i <= remainingCells; i++) {
                    calendarHTML += '<div class="day-cell other-month">' + i + '</div>';
                }
            }
            
            document.getElementById('calendar').innerHTML = calendarHTML;
        }

        function selectDate(year, month, day) {
            selectedDate = new Date(year, month - 1, day);
            updateTaskList();
        }

        function getPriorityText(priority) {
            const texts = {
                low: 'Низкий',
                medium: 'Средний',
                high: 'Высокий'
            };
            return texts[priority] || '';
        }

        function prevMonth() {
            currentDate.setMonth(currentDate.getMonth() - 1);
            renderCalendar(currentDate);
        }

        function nextMonth() {
            currentDate.setMonth(currentDate.getMonth() + 1);
            renderCalendar(currentDate);
        }

        function showAddModal() {
            currentTask = null;
            document.getElementById('taskModalTitle').textContent = 'Новая задача';
            document.getElementById('taskTitle').value = '';
            document.getElementById('taskDesc').value = '';
            document.getElementById('taskPriority').value = 'low';
            document.getElementById('taskModal').style.display = 'block';
        }

        function editTask(taskId) {
            const dateStr = formatDate(selectedDate);
            const task = (tasks[dateStr] || []).find(t => t.id === taskId);
            if (task) {
                currentTask = task;
                document.getElementById('taskModalTitle').textContent = 'Редактирование задачи';
                document.getElementById('taskTitle').value = task.title;
                document.getElementById('taskDesc').value = task.desc;
                document.getElementById('taskPriority').value = task.priority;
                document.getElementById('taskModal').style.display = 'block';
            }
        }

        function closeModal() {
            document.getElementById('taskModal').style.display = 'none';
            currentTask = null;
        }

        function saveTask() {
            const titleInput = document.getElementById('taskTitle');
            const descInput = document.getElementById('taskDesc');
            const prioritySelect = document.getElementById('taskPriority');
            
            if (!titleInput.value.trim()) {
                alert('Введите заголовок задачи');
                return;
            }
            
            const taskData = {
                id: currentTask ? currentTask.id : Date.now().toString(),
                title: titleInput.value,
                desc: descInput.value,
                priority: prioritySelect.value,
                createdAt: currentTask ? currentTask.createdAt : new Date().toISOString()
            };
            
            const dateStr = formatDate(selectedDate);
            if (!tasks[dateStr]) {
                tasks[dateStr] = [];
            }
            
            if (currentTask) {
                const taskIndex = tasks[dateStr].findIndex(t => t.id === currentTask.id);
                if (taskIndex !== -1) {
                    tasks[dateStr][taskIndex] = taskData;
                }
            } else {
                tasks[dateStr].push(taskData);
            }
            
            localStorage.setItem('tasks', JSON.stringify(tasks));
            
            titleInput.value = '';
            descInput.value = '';
            prioritySelect.value = 'low';
            
            closeModal();
            updateTaskList();
            renderCalendar(currentDate);
        }

        function deleteTask(taskId) {
            const dateStr = formatDate(selectedDate);
            if (!tasks[dateStr]) return;
            
            tasks[dateStr] = tasks[dateStr].filter(task => task.id !== taskId);
            
            if (tasks[dateStr].length === 0) {
                delete tasks[dateStr];
            }
            
            localStorage.setItem('tasks', JSON.stringify(tasks));
            updateTaskList();
            renderCalendar(currentDate);
        }

        function deleteAllTasks() {
            const dateStr = formatDate(selectedDate);
            delete tasks[dateStr];
            localStorage.setItem('tasks', JSON.stringify(tasks));
            updateTaskList();
            renderCalendar(currentDate);
        }

        function updateTaskList() {
            const dateStr = formatDate(selectedDate);
            const dayTasks = tasks[dateStr] || [];
            
            document.getElementById('taskHeader').textContent = 'Задачи на ' + formatDisplayDate(selectedDate);
            
            let deleteAllContainer = document.getElementById('deleteAllContainer');
            
            if (dayTasks.length === 0) {
                deleteAllContainer.innerHTML = '';
                document.getElementById('taskList').innerHTML = 
                    '<div class="empty-state">📭 Нет задач</div>';
            } else {
                deleteAllContainer.innerHTML = 
                    '<button class="delete-btn" onclick="deleteAllTasks()" title="Очистить все задачи">🗑️</button>';
                
                let taskHTML = '';
                dayTasks.forEach(task => {
                    taskHTML += '<div class="task-item">' +
                        '<div class="task-title">' +
                            task.title +
                            ' <span class="task-priority priority-' + task.priority + '">' + getPriorityText(task.priority) + '</span>' +
                        '</div>' +
                        (task.desc ? '<div class="task-desc">' + task.desc + '</div>' : '') +
                        '<div style="margin-top:5px;">' +
                            '<button class="delete-btn" onclick="editTask(\'' + task.id + '\')" title="Редактировать задачу" style="color:#34d399;">✏️</button>' +
                            '<button class="delete-btn" onclick="deleteTask(\'' + task.id + '\')" title="Удалить задачу">✕</button>' +
                        '</div>' +
                        '</div>';
                });
                document.getElementById('taskList').innerHTML = taskHTML;
            }
        }

        function formatDisplayDate(date) {
            const today = new Date();
            if (formatDate(date) === formatDate(today)) return 'сегодня';
            if (formatDate(date) === formatDate(new Date(today.getFullYear(), today.getMonth(), today.getDate() + 1))) return 'завтра';
            return `${String(date.getDate()).padStart(2, '0')}.${String(date.getMonth()+1).padStart(2, '0')}.${date.getFullYear()}`;
        }

        // Инициализация при загрузке
        window.onload = function() {
            initTelegram();
            renderCalendar(currentDate);
            updateTaskList();
        };
    </script>
</body>
</html>
