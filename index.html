<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PlanerBot - Календарь задач</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #1e1e2e;
            color: #e2e8f0;
            font-family: 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
            padding: 15px;
        }
        
        /* Верхний блок - профиль */
        .profile-block {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid #334155;
        }
        
        .user-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #34d399;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        
        .user-info h2 {
            font-size: 1.3em;
            font-weight: 600;
        }
        
        .user-info p {
            color: #94a3b8;
            font-size: 0.9em;
        }
        
        /* Карточки */
        .creation-cards, .list-cards {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 25px;
        }
        
        .card {
            background: #334155;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .card:hover {
            background: #3d5067;
        }
        
        .card-icon {
            font-size: 28px;
            margin-bottom: 8px;
        }
        
        .card-text {
            font-size: 1.1em;
            font-weight: 500;
        }
        
        /* Футер */
        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 15px;
            border-top: 1px solid #334155;
        }
        
        .footer-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.1em;
        }
        
        .footer-item.active {
            color: #34d399;
        }
        
        /* Календарь */
        .calendar-container {
            display: none;
            animation: fadeIn 0.3s;
        }
        
        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .month-btn {
            background: #334155;
            border: none;
            color: #e2e8f0;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
        }
        
        .month-title {
            font-weight: bold;
            font-size: 1.2em;
        }
        
        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 3px;
            margin-bottom: 5px;
        }
        
        .weekday {
            text-align: center;
            color: #94a3b8;
            font-size: 0.8em;
            padding: 8px 0;
        }
        
        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 3px;
        }
        
        .day-cell {
            aspect-ratio: 1;
            background: #334155;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 5px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .day-cell:hover {
            background: #3d5067;
        }
        
        .day-number {
            font-size: 0.75em;
            color: #94a3b8;
            align-self: flex-start;
        }
        
        .today .day-number {
            color: #34d399;
            font-weight: bold;
        }
        
        .other-month {
            opacity: 0.4;
        }
        
        .task-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            margin-top: auto;
            background: #34d399;
        }
        
        /* Форма задачи */
        .task-form {
            display: none;
            animation: fadeIn 0.3s;
            margin-top: 15px;
        }
        
        .task-form h2 {
            font-size: 1.3em;
            margin-bottom: 15px;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        .form-label {
            display: block;
            margin-bottom: 5px;
            color: #94a3b8;
        }
        
        .form-input {
            width: 100%;
            padding: 12px;
            background: #334155;
            border: 1px solid #444;
            border-radius: 8px;
            color: #e2e8f0;
            font-size: 1em;
        }
        
        .time-toggle {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }
        
        .time-radio {
            display: none;
        }
        
        .time-option {
            flex: 1;
            padding: 10px;
            background: #334155;
            border: 2px solid transparent;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .time-radio:checked + .time-option {
            border-color: #34d399;
        }
        
        .time-inputs {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        
        .time-input {
            flex: 1;
            padding: 10px;
            background: #334155;
            border: 1px solid #444;
            border-radius: 6px;
            color: #e2e8f0;
            font-size: 1em;
        }
        
        .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        
        .btn-submit {
            flex: 1;
            background: #34d399;
            color: #1e1e2e;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        
        .btn-cancel {
            flex: 1;
            background: #ef4444;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        
        .back-btn {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 1.2em;
            cursor: pointer;
            margin-bottom: 15px;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>
    <!-- Верхний блок: профиль -->
    <div class="profile-block">
        <div class="user-avatar">👤</div>
        <div class="user-info">
            <h2 id="userName">Загрузка...</h2>
            <p>Премиум подписка ✓</p>
        </div>
    </div>

    <!-- Главное меню -->
    <div id="mainMenu">
        <!-- Средние карточки создания -->
        <div class="creation-cards">
            <div class="card" onclick="createTask()">
                <div class="card-icon">✅</div>
                <div class="card-text">Создать задачу</div>
            </div>
            <div class="card" onclick="createMeeting()">
                <div class="card-icon">📅</div>
                <div class="card-text">Создать встречу</div>
            </div>
        </div>

        <!-- Нижние карточки списков -->
        <div class="list-cards">
            <div class="card" onclick="viewTasks()">
                <div class="card-icon">📋</div>
                <div class="card-text">Созданные задачи</div>
            </div>
            <div class="card" onclick="viewMeetings()">
                <div class="card-icon">📆</div>
                <div class="card-text">Созданные встречи</div>
            </div>
        </div>

        <!-- Футер -->
        <div class="footer">
            <div class="footer-item active">
                <span>📅</span>
                <span>Расписание</span>
            </div>
            <div class="footer-item">
                <span>⚙️</span>
                <span>Настройки</span>
            </div>
        </div>
    </div>

    <!-- Интерфейс создания задачи -->
    <div class="calendar-container" id="taskCalendarContainer">
        <div class="calendar-header">
            <button class="month-btn" onclick="backToMenu()">←</button>
            <div class="month-title" id="calendarMonth">Август 2026</div>
            <button class="month-btn" onclick="nextMonthCal()">›</button>
        </div>
        
        <div class="weekdays">
            <div class="weekday">Пн</div>
            <div class="weekday">Вт</div>
            <div class="weekday">Ср</div>
            <div class="weekday">Чт</div>
            <div class="weekday">Пт</div>
            <div class="weekday">Сб</div>
            <div class="weekday">Вс</div>
        </div>
        
        <div class="days-grid" id="calendarDays"></div>
    </div>

    <!-- Форма создания задачи -->
    <div class="task-form" id="taskForm">
        <button class="back-btn" onclick="backToCalendar()">←</button>
        <h2>Новая задача</h2>
        
        <div class="form-group">
            <label class="form-label">Дата: <span id="selectedDateText"></span></label>
        </div>
        
        <div class="form-group">
            <label class="form-label">Название задачи *</label>
            <input type="text" class="form-input" id="taskTitle" placeholder="Введите название задачи">
        </div>
        
        <div class="form-group">
            <label class="form-label">Описание задачи</label>
            <textarea class="form-input" id="taskDesc" placeholder="Введите описание задачи" rows="3"></textarea>
        </div>
        
        <div class="form-group">
            <label class="form-label">Время выполнения</label>
            <div class="time-toggle">
                <label class="time-option">
                    <input type="radio" name="timeType" class="time-radio" value="single" checked>
                    Одиночное время
                </label>
                <label class="time-option">
                    <input type="radio" name="timeType" class="time-radio" value="range">
                    Промежуток времени
                </label>
            </div>
            
            <div id="singleTime" class="time-inputs">
                <input type="time" class="time-input" id="taskTime">
            </div>
            
            <div id="rangeTime" class="time-inputs" style="display:none;">
                <input type="time" class="time-input" id="taskTimeStart">
                <input type="time" class="time-input" id="taskTimeEnd">
            </div>
        </div>
        
        <div class="form-actions">
            <button class="btn-cancel" onclick="backToCalendar()">Отмена</button>
            <button class="btn-submit" onclick="saveTask()">Сохранить задачу</button>
        </div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        let tg;
        let currentDate = new Date();
        let selectedDate = null;
        let tasks = JSON.parse(localStorage.getItem('tasks')) || {};
        
        const MONTH_NAMES = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь',
                             'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
        
        const DAY_HEADERS = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];

        window.onload = function() {
            if (window.Telegram && window.Telegram.WebApp) {
                tg = window.Telegram.WebApp;
                
                if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                    const user = tg.initDataUnsafe.user;
                    document.getElementById('userName').textContent = user.first_name || 'Гость';
                }
                
                tg.setHeaderColor('#1e1e2e');
                tg.setBackgroundColor('#1e1e2e');
            }
        };
        
        function formatDate(date) {
            return date.getFullYear() + '-' +
                   String(date.getMonth() + 1).padStart(2, '0') + '-' +
                   String(date.getDate()).padStart(2, '0');
        }
        
        function renderCalendar(date) {
            const year = date.getFullYear();
            const month = date.getMonth();
            
            document.getElementById('calendarMonth').textContent = 
                MONTH_NAMES[month] + ' ' + year;
            
            const firstDay = new Date(year, month, 1).getDay();
            const lastDate = new Date(year, month + 1, 0).getDate();
            const adjustedFirstDay = firstDay === 0 ? 6 : firstDay - 1;
            
            const today = new Date();
            const todayStr = formatDate(today);
            
            let daysHTML = '';
            
            // Дни предыдущего месяца
            const prevMonthLastDate = new Date(year, month, 0).getDate();
            for (let i = adjustedFirstDay - 1; i >= 0; i--) {
                daysHTML += '<div class="day-cell other-month">' + (prevMonthLastDate - i) + '</div>';
            }
            
            // Дни текущего месяца
            for (let d = 1; d <= lastDate; d++) {
                const dateStr = year + '-' + String(month + 1).padStart(2, '00') + '-' + String(d).padStart(2, '0');
                const dayTasks = tasks[dateStr] || [];
                
                let taskDot = '';
                if (dayTasks.length > 0) {
                    taskDot = '<div class="task-dot"></div>';
                }
                
                let classes = 'day-cell';
                if (dateStr === todayStr) classes += ' today';
                
                daysHTML += '<div class="' + classes + '" onclick="selectDate(' + year + ', ' + (month + 1) + ', ' + d + ')">' +
                    '<div class="day-number">' + d + '</div>' +
                    taskDot +
                    '</div>';
            }
            
            // Дни следующего месяца
            const totalCells = adjustedFirstDay + lastDate;
            const remainingCells = 7 - (totalCells % 7);
            if (remainingCells < 7) {
                for (let i = 1; i <= remainingCells; i++) {
                    daysHTML += '<div class="day-cell other-month">' + i + '</div>';
                }
            }
            
            document.getElementById('calendarDays').innerHTML = daysHTML;
        }
        
        function selectDate(year, month, day) {
            selectedDate = new Date(year, month - 1, day);
            
            // Форматируем дату для отображения
            const dateStr = formatDate(selectedDate);
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('selectedDateText').textContent = 
                selectedDate.toLocaleDateString('ru-RU', options);
            
            // Переключаемся на форму задачи
            document.getElementById('taskCalendarContainer').style.display = 'none';
            document.getElementById('taskForm').style.display = 'block';
        }
        
        function backToCalendar() {
            document.getElementById('taskForm').style.display = 'none';
            document.getElementById('taskCalendarContainer').style.display = 'block';
            selectedDate = null;
        }
        
        function backToMenu() {
            document.getElementById('taskCalendarContainer').style.display = 'none';
            document.getElementById('mainMenu').style.display = 'block';
        }
        
        function createTask() {
            document.getElementById('mainMenu').style.display = 'none';
            renderCalendar(currentDate);
            document.getElementById('taskCalendarContainer').style.display = 'block';
        }
        
        function createMeeting() {
            alert('Создание встречи - в разработке');
        }
        
        function viewTasks() {
            alert('Просмотр задач - в разработке');
        }
        
        function viewMeetings() {
            alert('Просмотр встреч - в разработке');
        }
        
        function nextMonthCal() {
            currentDate.setMonth(currentDate.getMonth() + 1);
            renderCalendar(currentDate);
        }
        
        function saveTask() {
            if (!selectedDate) return;
            
            const title = document.getElementById('taskTitle').value.trim();
            const desc = document.getElementById('taskDesc').value;
            const dateStr = formatDate(selectedDate);
            
            const timeType = document.querySelector('input[name="timeType"]:checked').value;
            let timeInfo = null;
            
            if (timeType === 'single') {
                timeInfo = {
                    type: 'single',
                    time: document.getElementById('taskTime').value
                };
            } else {
                timeInfo = {
                    type: 'range',
                    start: document.getElementById('taskTimeStart').value,
                    end: document.getElementById('taskTimeEnd').value
                };
            }
            
            if (!title) {
                alert('Введите название задачи');
                return;
            }
            
            const task = {
                id: Date.now(),
                title: title,
                desc: desc,
                time: timeInfo,
                createdAt: new Date().toISOString()
            };
            
            if (!tasks[dateStr]) {
                tasks[dateStr] = [];
            }
            tasks[dateStr].push(task);
            
            localStorage.setItem('tasks', JSON.stringify(tasks));
            
            // Отправка в Telegram
            if (tg) {
                tg.sendData(JSON.stringify({
                    action: 'task_created',
                    task: task,
                    date: dateStr
                }));
            }
            
            alert('Задача сохранена!');
            backToCalendar();
            renderCalendar(currentDate);
            
            // Очистка формы
            document.getElementById('taskTitle').value = '';
            document.getElementById('taskDesc').value = '';
            document.getElementById('taskTime').value = '';
            document.getElementById('taskTimeStart').value = '';
            document.getElementById('taskTimeEnd').value = '';
        }
    </script>
</body>
</html>
